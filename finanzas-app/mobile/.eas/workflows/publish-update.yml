# Publishes an over-the-air update of the app from `main` (production), run by EAS
# through the Expo GitHub app connected to this repository. See finanzas-app/docs/deploy.md.
# OTA ships JS and assets only: a change that adds a native module needs a new
# `eas build` first (runtimeVersion policy is `appVersion`).
# EXPO_PUBLIC_API_URL comes from the EAS `production` environment variables.
name: Publish update

on:
  push:
    branches:
      - main
    paths:
      - 'finanzas-app/mobile/**'

jobs:
  approve:
    type: require-approval
  publish_update:
    needs: [approve]
    type: update
    environment: production
    params:
      # `preview` is the channel the installed builds listen to; switch to
      # `production` once a store build exists.
      channel: preview
      platform: all
      message: 'Update from ${{ github.ref_name }}'
