name: Deploy backend

# One long-lived branch per environment, promoted by pull requests:
#   dev      -> Railway `dev`        (integration: every merged PR lands here first)
#   staging  -> Railway `staging`    (promote dev -> staging with a PR; first real deploy)
#   main     -> Railway `production` (promote staging -> main with a PR; manual approval)
# Each push runs CI, deploys that branch's environment, waits for it to be
# healthy and smoke-tests it. See finanzas-app/docs/deploy.md.

on:
  push:
    branches: [dev, staging, main]
    paths:
      - 'finanzas-app/backend/**'
  workflow_dispatch:

permissions:
  contents: read

# One deploy per environment at a time; a newer push queues behind an
# in-flight (or approval-pending) deploy instead of cancelling it.
concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    # workflow_dispatch from a feature branch must not create ad-hoc environments.
    if: contains(fromJSON('["dev","staging","main"]'), github.ref_name)
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/_deploy-backend-env.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
      base_url: ${{ github.ref_name == 'main' && 'https://backend-production-0d37.up.railway.app' || github.ref_name == 'staging' && 'https://backend-staging-494d.up.railway.app' || 'https://backend-dev-2110.up.railway.app' }}
