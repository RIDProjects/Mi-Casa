name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'finanzas-app/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'finanzas-app/mobile/**'
      - '.github/workflows/mobile-ci.yml'

defaults:
  run:
    working-directory: finanzas-app/mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finanzas-app/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci
