name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'finanzas-app/frontend/**'
  pull_request:

defaults:
  run:
    working-directory: finanzas-app/frontend

jobs:
  test:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finanzas-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
