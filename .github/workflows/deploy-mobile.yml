name: Deploy mobile (EAS Update)

# Publishes an over-the-air update of the Expo app to production. It runs only from
# `main` (the production branch of the dev -> staging -> main promotion flow, see
# finanzas-app/docs/deploy.md) and waits for the manual approval of the `production`
# GitHub Environment, like the backend deploy.
# OTA only: it ships JS and assets, never native code. A change that adds a native
# module needs a new build (`eas build`) first, or older installs will crash. The
# runtime version policy is `appVersion`, so installs of another app version ignore it.

on:
  push:
    branches: [main]
    paths:
      - 'finanzas-app/mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

jobs:
  ci:
    # workflow_dispatch from another branch must not publish an update.
    if: github.ref_name == 'main'
    uses: ./.github/workflows/mobile-ci.yml

  update:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: finanzas-app/mobile
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      # `preview` is the channel the installed builds listen to; set the environment
      # variable EAS_CHANNEL (e.g. `production`) once a store build exists.
      EAS_CHANNEL: ${{ vars.EAS_CHANNEL || 'preview' }}
      # Inlined into the JS bundle at export time (EXPO_PUBLIC_*).
      EXPO_PUBLIC_API_URL: https://backend-production-0d37.up.railway.app/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finanzas-app/mobile/package-lock.json

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is empty in GitHub Environment 'production' (create an access token at expo.dev -> Account settings -> Access tokens and store it as an environment secret)"
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: |
          npx --yes eas-cli@latest update \
            --channel "$EAS_CHANNEL" \
            --message "${GITHUB_SHA::7} via GitHub Actions" \
            --non-interactive
