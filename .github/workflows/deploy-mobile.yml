name: Deploy mobile (EAS Update)

# Publishes an over-the-air update of the Expo app on every push to a long-lived
# branch that touches the mobile app. Same branch-per-environment model as the
# backend (see finanzas-app/docs/deploy.md):
#   dev      -> EAS channel `development`
#   staging  -> EAS channel `staging`
#   main     -> EAS channel `preview` (the channel the installed builds listen to;
#               override with the environment variable EAS_CHANNEL once a store
#               build on `production` exists). Needs approval of the `production` environment.
# OTA only: it ships JS and assets, never native code. A change that adds a native
# module needs a new build (`eas build`) first, or older installs will crash.

on:
  push:
    branches: [dev, staging, main]
    paths:
      - 'finanzas-app/mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mobile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    # workflow_dispatch from a feature branch must not publish updates.
    if: contains(fromJSON('["dev","staging","main"]'), github.ref_name)
    uses: ./.github/workflows/mobile-ci.yml

  update:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    defaults:
      run:
        working-directory: finanzas-app/mobile
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      EAS_CHANNEL: ${{ vars.EAS_CHANNEL || (github.ref_name == 'main' && 'preview' || github.ref_name == 'staging' && 'staging' || 'development') }}
      # Inlined into the JS bundle at export time (EXPO_PUBLIC_*).
      EXPO_PUBLIC_API_URL: ${{ github.ref_name == 'main' && 'https://backend-production-0d37.up.railway.app/api/v1' || github.ref_name == 'staging' && 'https://backend-staging-494d.up.railway.app/api/v1' || 'https://backend-dev-2110.up.railway.app/api/v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finanzas-app/mobile/package-lock.json

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is empty in GitHub Environment '${{ github.ref_name == 'main' && 'production' || github.ref_name }}' (create an access token at expo.dev -> Account settings -> Access tokens and store it as an environment secret)"
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: |
          npx --yes eas-cli@latest update \
            --channel "$EAS_CHANNEL" \
            --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME} via GitHub Actions" \
            --non-interactive
