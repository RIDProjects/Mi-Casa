name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'finanzas-app/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'finanzas-app/backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: finanzas-app/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finanzas-app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test
