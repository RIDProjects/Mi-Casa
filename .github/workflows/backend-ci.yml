name: Backend CI

# Pushes to main run this via deploy-backend.yml (workflow_call) so CI gates the deploy.
on:
  workflow_call:
  pull_request:

defaults:
  run:
    working-directory: finanzas-app/backend

jobs:
  test:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finanzas-app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test
