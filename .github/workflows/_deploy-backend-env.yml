name: Deploy backend (reusable)

# Deploys finanzas-app/backend to one Railway environment and smoke-tests it.
# The job binds to the GitHub Environment of the same name, which supplies
# RAILWAY_TOKEN (a Railway project token scoped to that environment) and,
# for `production`, the manual approval gate.

on:
  workflow_call:
    inputs:
      environment:
        description: Railway + GitHub environment name (dev | staging | production)
        required: true
        type: string
      base_url:
        description: Public URL of the backend in that environment (no trailing slash)
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENV: ${{ inputs.environment }}
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # The image no longer runs migrations in CMD. If the environment lacks the
      # pre-deploy command, a deploy would silently skip them: refuse instead.
      - name: Assert pre-deploy migration step is configured
        run: |
          cmd=$(railway environment config --environment "$RAILWAY_ENV" --json | jq -r '[.services[] | .deploy.preDeployCommand // empty][0] | if type == "array" then join(" ") else . end // empty')
          case "$cmd" in
            *"migration:run"*) echo "pre-deploy: $cmd" ;;
            *) echo "::error::preDeployCommand missing in $RAILWAY_ENV (see finanzas-app/docs/deploy.md)"; exit 1 ;;
          esac

      - name: Record current deployment
        id: before
        run: |
          prev=$(railway deployment list --service backend --environment "$RAILWAY_ENV" --limit 1 --json | jq -r '.[0].id // "none"')
          echo "id=$prev" >> "$GITHUB_OUTPUT"

      - name: Deploy (migrations run in railway.json preDeployCommand)
        working-directory: finanzas-app/backend
        run: railway up --service backend --environment "$RAILWAY_ENV" --detach --message "${GITHUB_SHA::7} via GitHub Actions"

      - name: Wait for the new deployment to become healthy
        run: |
          for i in $(seq 1 60); do
            read -r id status < <(railway deployment list --service backend --environment "$RAILWAY_ENV" --limit 1 --json | jq -r '.[0] | "\(.id) \(.status)"')
            echo "attempt $i: $id $status"
            if [ "$id" != "${{ steps.before.outputs.id }}" ]; then
              case "$status" in
                SUCCESS) exit 0 ;;
                FAILED|CRASHED|REMOVED) echo "::error::Deployment $id ended as $status"; exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for deployment"; exit 1

      - name: Smoke test
        run: |
          set -eu
          curl_code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@" || true; }

          for i in $(seq 1 10); do
            code=$(curl_code "$BASE_URL/health")
            echo "health attempt $i: $code"
            [ "$code" = "200" ] && break
            [ "$i" = "10" ] && { echo "::error::/health never returned 200"; exit 1; }
            sleep 6
          done

          body=$(curl -s --max-time 10 "$BASE_URL/health")
          echo "$body" | jq -e '.status == "ok"' >/dev/null

          # Protected route without a token must be rejected: proves the global
          # prefix, routing and auth guard are live (no credentials needed).
          code=$(curl_code "$BASE_URL/api/v1/debts")
          echo "GET /api/v1/debts without token: $code"
          [ "$code" = "401" ] || { echo "::error::expected 401, got $code"; exit 1; }
